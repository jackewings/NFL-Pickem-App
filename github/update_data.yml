name: Update NFL Data

on:
  schedule:
    # Run check every hour from 7:30 AM to 7:30 PM CT
    - cron: '30 12-00 * * *'  # 7:30 AM - 7:30 PM CT (12:30-00:30 UTC)
    # Also run at set times on non-game days
    - cron: '0 15,19,23 * * *'  # 10 AM, 2 PM, 6 PM CT

jobs:
  check-and-update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      
      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.9'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          
      - name: Check if game day
        id: check-game-day
        run: |
          python src/check_game_day.py
          echo "is_game_day=$?" >> $GITHUB_ENV
          
      - name: Update data on game day
        if: env.is_game_day == '0' && github.event.schedule == '30 12-00 * * *'
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          python src/update_data.py
          
      - name: Update data on non-game day scheduled times
        if: env.is_game_day == '1' && github.event.schedule == '0 15,19,23 * * *'
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          python src/update_data.py
          
      - name: Commit and push if changed
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add data/
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update NFL data" && git push)