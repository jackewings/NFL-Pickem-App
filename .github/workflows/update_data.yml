name: Update NFL Data

on:
  schedule:
    # Sunday (0), Monday (1), Thursday (4): hourly 7:30am–11:30pm CT (12:30–04:30 UTC next day)
    - cron: '30 12-23 * * 0,1,4'
    - cron: '30 0-4 * * 1,2,5'
    # Tuesday (2), Wednesday (3), Friday (5), Saturday (6): 6:30am, 12:30pm, 6:30pm CT (11:30, 17:30, 23:30 UTC)
    - cron: '30 11,17,23 * * 2,3,5,6'
  workflow_dispatch:

jobs:
  check-and-update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Update data
        env:
          API_KEY: ${{ secrets.API_KEY }}
        run: python -m src/core/update_data

      - name: Manual update
        if: github.event_name == 'workflow_dispatch'
        env:
          API_KEY: ${{ secrets.API_KEY }}
        run: python -m src/core/update_data

      - name: Commit and push if changed
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git stash -u
          git pull origin main --rebase
          git stash pop || true
          git add -f data/weekly_spreads.csv
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update NFL data" && git push origin main)