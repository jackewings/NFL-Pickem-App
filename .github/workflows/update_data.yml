name: Update NFL Data

on:
  schedule:
    - cron: '30 12-19 * * *'  # 7:30 AM - 2:30 PM CT
    - cron: '0 15,19,23 * * *'  # 10 AM, 2 PM, 6 PM CT
  workflow_dispatch:

jobs:
  check-and-update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests pytz streamlit
          
      - name: Check if game day
        id: check-game-day
        run: |
          PYTHONPATH=$PYTHONPATH:$(pwd) python src/check_game_day.py
          OUTPUT=$(PYTHONPATH=$PYTHONPATH:$(pwd) python src/check_game_day.py)
          echo "IS_GAME_DAY=${OUTPUT}" >> $GITHUB_ENV
          
      - name: Update data (game day hourly)
        if: |
          env.IS_GAME_DAY == 'true' && 
          github.event.schedule == '30 12-19 * * *'
        env:
          API_KEY: ${{ secrets.API_KEY }}
        run: python src/update_data.py
          
      - name: Update data (non-game day scheduled)
        if: |
          env.IS_GAME_DAY == 'false' && 
          github.event.schedule == '0 15,19,23 * * *'
        env:
          API_KEY: ${{ secrets.API_KEY }}
        run: python src/update_data.py

      - name: Manual update
        if: github.event_name == 'workflow_dispatch'
        env:
          API_KEY: ${{ secrets.API_KEY }}
        run: python src/update_data.py
          
      - name: Commit and push if changed
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update NFL data" && git push)